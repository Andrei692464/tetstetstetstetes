name: Build MateNova APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Nu am găsit settings.gradle.kts sau settings.gradle în repository!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Compilez proiectul Android din: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload MateNova APK
        uses: actions/upload-artifact@v4
        with:
          name: MateNova-APK-Edition-v1.0
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
